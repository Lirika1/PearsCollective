<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Pearls Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23E9E0D2' stroke='%23B39A6E' stroke-width='4'/></svg>">
</head>
<body data-page="checkout">

  <div class="page-hero">
    <span class="eyebrow" data-i18n="checkout.eyebrow">Gati e juaja</span>
    <h1 data-i18n="checkout.title">Pagesa</h1>
  </div>

  <section style="padding-top:clamp(10px,2vw,30px)">
    <div class="container" id="checkoutWrap"></div>
  </section>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    function pageInit() { renderCheckout(); }

    function renderCheckout() {
      const wrap = document.getElementById("checkoutWrap");
      const items = Cart.read();

      if (!items.length) {
        wrap.innerHTML = `
          <div class="checkout-done">
            <h2>${t("checkout.emptyTitle")}</h2>
            <p>${t("checkout.emptyBody")}</p>
            <a class="btn" href="shop.html">${t("checkout.emptyCta")}</a>
          </div>`;
        return;
      }

      const subtotal = Cart.total();
      const shipping = subtotal >= 60 ? 0 : 3;

      wrap.innerHTML = `
        <div class="checkout-grid">
          <form id="checkoutForm" novalidate>
            <div class="checkout-section">
              <h2>${t("checkout.contact")}</h2>
              <div class="form-grid">
                <div class="field"><label for="fName">${t("checkout.firstName")}</label><input id="fName" required></div>
                <div class="field"><label for="lName">${t("checkout.lastName")}</label><input id="lName" required></div>
                <div class="field full"><label for="email">${t("checkout.email")}</label><input id="email" type="email" required></div>
                <div class="field full"><label for="phone">${t("checkout.phone")}</label><input id="phone" type="tel" placeholder="+383 …"></div>
              </div>

              <h2>${t("checkout.delivery")}</h2>
              <div class="form-grid">
                <div class="field full"><label for="addr">${t("checkout.address")}</label><input id="addr" required></div>
                <div class="field"><label for="city">${t("checkout.city")}</label><input id="city" required></div>
                <div class="field"><label for="country">${t("checkout.country")}</label>
                  <select id="country">
                    <option>${t("checkout.kosovo")}</option>
                    <option>${t("checkout.albania")}</option>
                    <option>${t("checkout.macedonia")}</option>
                  </select>
                </div>
              </div>

              <h2>${t("checkout.payment")}</h2>
              <div class="form-grid">
                <div class="field full"><label for="payMethod">${t("checkout.method")}</label>
                  <select id="payMethod">
                    <option>${t("checkout.cod")}</option>
                    <option>${t("checkout.transfer")}</option>
                  </select>
                </div>
              </div>
              <p class="pay-note">${t("checkout.payNote")}</p>

              <div style="margin-top:30px">
                <button class="btn" type="submit" style="width:100%">${t("checkout.place")} ${money(subtotal + shipping)}</button>
                <div class="form-msg" id="coMsg"></div>
              </div>
            </div>
          </form>

          <aside class="order-summary">
            <h3>${t("checkout.summary")}</h3>
            ${items.map(i => {
              const p = findProduct(i.id);
              return `<div class="os-item">
                <img src="${p.imgs[0]}" alt="${pName(p)}" style="object-position:${p.pos}">
                <div>
                  <div class="osi-n">${pName(p)}</div>
                  <div class="osi-q">${i.variant ? i.variant + " · " : ""}${t("checkout.qty")} ${i.qty}</div>
                </div>
                <div class="osi-p">${money(p.price * i.qty)}</div>
              </div>`;
            }).join("")}
            <div class="os-row" style="margin-top:14px"><span>${t("checkout.subtotal")}</span><span>${money(subtotal)}</span></div>
            <div class="os-row"><span>${t("checkout.shipping")}</span><span>${shipping === 0 ? t("checkout.free") : money(shipping)}</span></div>
            <div class="os-row total"><span>${t("checkout.total")}</span><span>${money(subtotal + shipping)}</span></div>
          </aside>
        </div>`;

      document.getElementById("checkoutForm").addEventListener("submit", e => {
        e.preventDefault();
        const required = ["fName", "lName", "email", "addr", "city"];
        const missing = required.some(id => !document.getElementById(id).value.trim());
        if (missing) {
          document.getElementById("coMsg").textContent = t("checkout.missing");
          return;
        }
        Cart.clear();
        wrap.innerHTML = `
          <div class="checkout-done">
            <span class="eyebrow">${t("checkout.doneEyebrow")}</span>
            <h2>${t("checkout.doneTitle")}</h2>
            <p>${t("checkout.doneBody")}</p>
            <a class="btn" href="index.html">${t("checkout.doneCta")}</a>
          </div>`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
