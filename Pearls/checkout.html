<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — Pearls Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23E9E0D2' stroke='%23B39A6E' stroke-width='4'/></svg>">
</head>
<body data-page="checkout">

  <div class="page-hero">
    <span class="eyebrow">Almost yours</span>
    <h1>Checkout</h1>
  </div>

  <section style="padding-top:clamp(10px,2vw,30px)">
    <div class="container" id="checkoutWrap"></div>
  </section>

  <script src="assets/js/products.js"></script>
  <script>
    function pageInit() { renderCheckout(); }

    function renderCheckout() {
      const wrap = document.getElementById("checkoutWrap");
      const items = Cart.read();

      if (!items.length) {
        wrap.innerHTML = `
          <div class="checkout-done">
            <h2>Your bag is empty</h2>
            <p>“Your forever pieces are still waiting to be found.”</p>
            <a class="btn" href="shop.html">Shop the Collection</a>
          </div>`;
        return;
      }

      const subtotal = Cart.total();
      const shipping = subtotal >= 60 ? 0 : 3;

      wrap.innerHTML = `
        <div class="checkout-grid">
          <form id="checkoutForm" novalidate>
            <div class="checkout-section">
              <h2>Contact</h2>
              <div class="form-grid">
                <div class="field"><label for="fName">First name</label><input id="fName" required></div>
                <div class="field"><label for="lName">Last name</label><input id="lName" required></div>
                <div class="field full"><label for="email">Email</label><input id="email" type="email" required></div>
                <div class="field full"><label for="phone">Phone</label><input id="phone" type="tel" placeholder="+383 …"></div>
              </div>

              <h2>Delivery</h2>
              <div class="form-grid">
                <div class="field full"><label for="addr">Address</label><input id="addr" required></div>
                <div class="field"><label for="city">City</label><input id="city" required></div>
                <div class="field"><label for="country">Country</label>
                  <select id="country">
                    <option>Kosovo</option>
                    <option>Albania</option>
                    <option>North Macedonia</option>
                  </select>
                </div>
              </div>

              <h2>Payment</h2>
              <div class="form-grid">
                <div class="field full"><label for="payMethod">Method</label>
                  <select id="payMethod">
                    <option>Cash on delivery</option>
                    <option>Bank transfer</option>
                  </select>
                </div>
              </div>
              <p class="pay-note">This is a preview store — no payment is taken online. We confirm every order personally before it ships.</p>

              <div style="margin-top:30px">
                <button class="btn" type="submit" style="width:100%">Place Order — ${money(subtotal + shipping)}</button>
                <div class="form-msg" id="coMsg"></div>
              </div>
            </div>
          </form>

          <aside class="order-summary">
            <h3>Order Summary</h3>
            ${items.map(i => {
              const p = findProduct(i.id);
              return `<div class="os-item">
                <img src="${p.imgs[0]}" alt="${p.name}" style="object-position:${p.pos}">
                <div>
                  <div class="osi-n">${p.name}</div>
                  <div class="osi-q">${i.variant ? i.variant + " · " : ""}Qty ${i.qty}</div>
                </div>
                <div class="osi-p">${money(p.price * i.qty)}</div>
              </div>`;
            }).join("")}
            <div class="os-row" style="margin-top:14px"><span>Subtotal</span><span>${money(subtotal)}</span></div>
            <div class="os-row"><span>Shipping</span><span>${shipping === 0 ? "Free" : money(shipping)}</span></div>
            <div class="os-row total"><span>Total</span><span>${money(subtotal + shipping)}</span></div>
          </aside>
        </div>`;

      document.getElementById("checkoutForm").addEventListener("submit", e => {
        e.preventDefault();
        const required = ["fName", "lName", "email", "addr", "city"];
        const missing = required.some(id => !document.getElementById(id).value.trim());
        if (missing) {
          document.getElementById("coMsg").textContent = "Please complete your contact and delivery details.";
          return;
        }
        Cart.clear();
        wrap.innerHTML = `
          <div class="checkout-done">
            <span class="eyebrow">Order received</span>
            <h2>Thank You</h2>
            <p>“Your pieces are being wrapped with love. We'll be in touch to confirm delivery — see you at the aisle.”</p>
            <a class="btn" href="index.html">Back to Home</a>
          </div>`;
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
