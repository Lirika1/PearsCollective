<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Pearls Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23E9E0D2' stroke='%23B39A6E' stroke-width='4'/></svg>">
</head>
<body data-page="product">

  <section class="product-page">
    <div class="container">
      <div class="breadcrumbs" id="crumbs"></div>
      <div class="pdp-grid" id="pdp"></div>
    </div>
  </section>

  <section class="related" style="padding-bottom:clamp(56px,9vw,110px)">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow" data-i18n="product.relatedEyebrow">Plotësoni pamjen</span>
        <h2 class="section-title" data-i18n="product.relatedTitle">Mund t'ju pëlqejnë edhe</h2>
      </div>
      <div class="products-grid" id="relatedGrid"></div>
    </div>
  </section>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    let product, qty = 1, chosenVariant = null;

    function pageInit() {
      const id = new URLSearchParams(location.search).get("id");
      product = findProduct(id) || PRODUCTS[0];
      chosenVariant = product.variants ? product.variants[0].options[0] : null;
      document.title = `${pName(product)} — Pearls Collective`;

      document.getElementById("crumbs").innerHTML =
        `<a href="index.html">${t("product.home")}</a> &nbsp;/&nbsp; <a href="shop.html?cat=${product.category}">${categoryLabel(product.category)}</a> &nbsp;/&nbsp; ${pName(product)}`;

      document.getElementById("pdp").innerHTML = `
        <div class="pdp-gallery">
          <div class="pdp-main"><img id="mainImg" src="${product.imgs[0]}" alt="${pName(product)}" style="object-position:${product.pos}"></div>
          ${product.imgs.length > 1 ? `
          <div class="pdp-thumbs">
            ${product.imgs.map((src, i) => `
              <button class="${i === 0 ? "active" : ""}" data-thumb="${i}"><img src="${src}" alt="${pName(product)} ${i + 1}"></button>`).join("")}
          </div>` : ""}
        </div>
        <div class="pdp-info">
          <span class="eyebrow">${categoryLabel(product.category)}${product.isNew ? " · " + t("product.badgeNew") : ""}</span>
          <h1>${pName(product)}</h1>
          <div class="pdp-price">${money(product.price)}</div>
          <p class="pdp-desc">${pDesc(product)}</p>

          ${product.variants ? product.variants.map(v => `
            <div class="pdp-variants">
              <label>${I18N.pick(v.label)}</label>
              <div class="variant-opts">
                ${v.options.map((o, i) => { const label = I18N.pick(o); return `<button class="${i === 0 ? "active" : ""}" data-variant="${label}">${label}</button>`; }).join("")}
              </div>
            </div>`).join("") : ""}

          <div class="pdp-buy">
            <div class="qty">
              <button id="qDec" aria-label="${t("cart.decrease")}">−</button>
              <input id="qVal" value="1" readonly aria-label="${t("product.quantity")}">
              <button id="qInc" aria-label="${t("cart.increase")}">+</button>
            </div>
            <button class="btn" id="addBtn">${t("product.addToBag")}</button>
          </div>
          <div class="pdp-stock">${t("product.inStock")}</div>

          <div class="accordion">
            <details open>
              <summary>${t("product.detailsTitle")}</summary>
              <div class="acc-body"><ul>${pDetails(product).map(d => `<li>${d}</li>`).join("")}</ul></div>
            </details>
            <details>
              <summary>${t("product.deliveryTitle")}</summary>
              <div class="acc-body">${t("product.deliveryBody")}</div>
            </details>
            <details>
              <summary>${t("product.returnsTitle")}</summary>
              <div class="acc-body">${t("product.returnsBody")}</div>
            </details>
          </div>
        </div>`;

      document.querySelectorAll("[data-thumb]").forEach(b => b.addEventListener("click", () => {
        document.getElementById("mainImg").src = product.imgs[+b.dataset.thumb];
        document.querySelectorAll("[data-thumb]").forEach(x => x.classList.toggle("active", x === b));
      }));
      document.querySelectorAll("[data-variant]").forEach(b => b.addEventListener("click", () => {
        chosenVariant = b.dataset.variant;
        b.closest(".variant-opts").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
      }));
      document.getElementById("qInc").addEventListener("click", () => setQty(qty + 1));
      document.getElementById("qDec").addEventListener("click", () => setQty(qty - 1));
      document.getElementById("addBtn").addEventListener("click", () => {
        Cart.add(product.id, qty, chosenVariant);
        toast(`${pName(product)} ${t("cart.added")}`);
        openCart();
      });

      const related = PRODUCTS.filter(p => p.id !== product.id)
        .sort((a, b) => (b.category === product.category ? 1 : 0) - (a.category === product.category ? 1 : 0))
        .slice(0, 4);
      const rg = document.getElementById("relatedGrid");
      rg.innerHTML = related.map(productCard).join("");
      wireProductCards(rg);
    }

    function setQty(n) {
      qty = Math.max(1, Math.min(9, n));
      document.getElementById("qVal").value = qty;
    }
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
