<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Pearls Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23E9E0D2' stroke='%23B39A6E' stroke-width='4'/></svg>">
</head>
<body data-page="product">

  <section class="product-page">
    <div class="container">
      <div class="breadcrumbs" id="crumbs"></div>
      <div class="pdp-grid" id="pdp"></div>
    </div>
  </section>

  <section class="related" style="padding-bottom:clamp(56px,9vw,110px)">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Complete the look</span>
        <h2 class="section-title">You May Also Like</h2>
      </div>
      <div class="products-grid" id="relatedGrid"></div>
    </div>
  </section>

  <script src="assets/js/products.js"></script>
  <script>
    let product, qty = 1, chosenVariant = null;

    function pageInit() {
      const id = new URLSearchParams(location.search).get("id");
      product = findProduct(id) || PRODUCTS[0];
      chosenVariant = product.variants ? product.variants[0].options[0] : null;
      document.title = `${product.name} — Pearls Collective`;

      document.getElementById("crumbs").innerHTML =
        `<a href="index.html">Home</a> &nbsp;/&nbsp; <a href="shop.html?cat=${product.category}">${CATEGORY_LABELS[product.category]}</a> &nbsp;/&nbsp; ${product.name}`;

      document.getElementById("pdp").innerHTML = `
        <div class="pdp-gallery">
          <div class="pdp-main"><img id="mainImg" src="${product.imgs[0]}" alt="${product.name}" style="object-position:${product.pos}"></div>
          ${product.imgs.length > 1 ? `
          <div class="pdp-thumbs">
            ${product.imgs.map((src, i) => `
              <button class="${i === 0 ? "active" : ""}" data-thumb="${i}"><img src="${src}" alt="View ${i + 1}"></button>`).join("")}
          </div>` : ""}
        </div>
        <div class="pdp-info">
          <span class="eyebrow">${CATEGORY_LABELS[product.category]}${product.isNew ? " · New" : ""}</span>
          <h1>${product.name}</h1>
          <div class="pdp-price">${money(product.price)}</div>
          <p class="pdp-desc">${product.desc}</p>

          ${product.variants ? product.variants.map(v => `
            <div class="pdp-variants">
              <label>${v.label}</label>
              <div class="variant-opts">
                ${v.options.map((o, i) => `<button class="${i === 0 ? "active" : ""}" data-variant="${o}">${o}</button>`).join("")}
              </div>
            </div>`).join("") : ""}

          <div class="pdp-buy">
            <div class="qty">
              <button id="qDec" aria-label="Decrease quantity">−</button>
              <input id="qVal" value="1" readonly aria-label="Quantity">
              <button id="qInc" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn" id="addBtn">Add to Bag</button>
          </div>
          <div class="pdp-stock">In stock — ships within 1–2 working days</div>

          <div class="accordion">
            <details open>
              <summary>Details &amp; Materials</summary>
              <div class="acc-body"><ul>${product.details.map(d => `<li>${d}</li>`).join("")}</ul></div>
            </details>
            <details>
              <summary>Delivery</summary>
              <div class="acc-body">Free shipping on orders over €60 to Kosovo, Albania &amp; Macedonia. Standard delivery €3, arriving in 2–4 working days. Each order is wrapped by hand in our signature packaging.</div>
            </details>
            <details>
              <summary>Returns</summary>
              <div class="acc-body">Changed your mind? Unworn pieces in original packaging may be returned within 14 days of delivery. Contact us and we will arrange everything for you.</div>
            </details>
          </div>
        </div>`;

      document.querySelectorAll("[data-thumb]").forEach(b => b.addEventListener("click", () => {
        document.getElementById("mainImg").src = product.imgs[+b.dataset.thumb];
        document.querySelectorAll("[data-thumb]").forEach(x => x.classList.toggle("active", x === b));
      }));
      document.querySelectorAll("[data-variant]").forEach(b => b.addEventListener("click", () => {
        chosenVariant = b.dataset.variant;
        b.closest(".variant-opts").querySelectorAll("button").forEach(x => x.classList.toggle("active", x === b));
      }));
      document.getElementById("qInc").addEventListener("click", () => setQty(qty + 1));
      document.getElementById("qDec").addEventListener("click", () => setQty(qty - 1));
      document.getElementById("addBtn").addEventListener("click", () => {
        Cart.add(product.id, qty, chosenVariant);
        toast(`${product.name} added to bag`);
        openCart();
      });

      const related = PRODUCTS.filter(p => p.id !== product.id)
        .sort((a, b) => (b.category === product.category ? 1 : 0) - (a.category === product.category ? 1 : 0))
        .slice(0, 4);
      const rg = document.getElementById("relatedGrid");
      rg.innerHTML = related.map(productCard).join("");
      wireProductCards(rg);
    }

    function setQty(n) {
      qty = Math.max(1, Math.min(9, n));
      document.getElementById("qVal").value = qty;
    }
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
