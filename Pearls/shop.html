<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Pearls Collective</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23E9E0D2' stroke='%23B39A6E' stroke-width='4'/></svg>">
</head>
<body data-page="shop">

  <div class="page-hero">
    <span class="eyebrow" data-i18n="shop.eyebrow">Koleksioni</span>
    <h1 id="shopTitle">Të gjitha bizhuteritë</h1>
    <p id="shopSub">Copë të përjetshme për nuse, shoqëruese dhe raste të bukura.</p>
  </div>

  <section style="padding-top:0">
    <div class="container">
      <div class="shop-toolbar">
        <div class="filter-pills" id="filterPills"></div>
        <div style="display:flex; align-items:center; gap:22px">
          <span class="shop-count" id="shopCount"></span>
          <select class="sort-select" id="sortSelect" data-i18n-attr="aria-label:shop.sortLabel" aria-label="Rendit copët">
            <option value="featured" data-i18n="shop.sortFeatured">Rendit · Të zgjedhurat</option>
            <option value="price-asc" data-i18n="shop.sortPriceAsc">Çmimi · Nga i ulëti</option>
            <option value="price-desc" data-i18n="shop.sortPriceDesc">Çmimi · Nga i larti</option>
            <option value="new" data-i18n="shop.sortNew">Më të rejat në fillim</option>
          </select>
        </div>
      </div>

      <div id="hairNotice" style="display:none">
        <div class="coming-soon">
          <span class="eyebrow" data-i18n="shop.hairEyebrow">Bizhuteri flokësh</span>
          <h2 data-i18n="shop.hairTitle">Detaji i duhur, së shpejti</h2>
          <p data-i18n="shop.hairBody">“Përzgjedhja jonë po përgatitet me kujdes.”</p>
          <a class="btn btn--ghost" href="contact.html" data-i18n="shop.hairCta">Pyetje për nuse</a>
        </div>
      </div>

      <div class="products-grid" id="shopGrid"></div>
      <div class="shop-empty" id="shopEmpty" style="display:none" data-i18n="shop.empty">Ende asnjë copë në këtë përzgjedhje.</div>
    </div>
  </section>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script>
    /* Labels and blurbs come from the language layer — see i18n.js (shop.subs)
       and products.js (CATEGORY_LABELS). */
    const CAT_KEYS = ["all", "new", "bridal", "earrings", "necklaces", "bracelets", "hair"];
    const catLabel = k => k === "all" ? t("shop.cats.all") : categoryLabel(k);
    const catSub = k => t("shop.subs." + k);

    let currentCat = new URLSearchParams(location.search).get("cat") || "all";
    if (!CAT_KEYS.includes(currentCat)) currentCat = "all";
    let currentSort = "featured";

    function pageInit() {
      const pills = document.getElementById("filterPills");
      pills.innerHTML = CAT_KEYS.map(key =>
        `<button class="pill ${key === currentCat ? "active" : ""}" data-cat="${key}">${catLabel(key)}</button>`).join("");
      pills.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => {
        currentCat = b.dataset.cat;
        history.replaceState(null, "", currentCat === "all" ? "shop.html" : `shop.html?cat=${currentCat}`);
        pills.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.cat === currentCat));
        render();
      }));
      document.getElementById("sortSelect").addEventListener("change", e => { currentSort = e.target.value; render(); });
      render();
    }

    function render() {
      const grid = document.getElementById("shopGrid");
      const empty = document.getElementById("shopEmpty");
      const hairNotice = document.getElementById("hairNotice");
      const title = document.getElementById("shopTitle");
      const sub = document.getElementById("shopSub");

      title.textContent = currentCat === "all" ? t("shop.titleAll") : catLabel(currentCat);
      sub.textContent = catSub(currentCat) || catSub("all");
      hairNotice.style.display = currentCat === "hair" ? "block" : "none";

      let items = PRODUCTS.filter(p => {
        if (currentCat === "all") return true;
        if (currentCat === "new") return p.isNew;
        return p.category === currentCat;
      });

      if (currentSort === "price-asc") items.sort((a, b) => a.price - b.price);
      else if (currentSort === "price-desc") items.sort((a, b) => b.price - a.price);
      else if (currentSort === "new") items.sort((a, b) => (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0));

      document.getElementById("shopCount").textContent =
        items.length ? (items.length === 1 ? t("shop.countOne") : t("shop.countMany", { n: items.length })) : "";

      grid.innerHTML = items.map(productCard).join("");
      empty.style.display = (!items.length && currentCat !== "hair") ? "block" : "none";
      wireProductCards(grid);
      initReveals();
    }
  </script>
  <script src="assets/js/app.js"></script>
</body>
</html>
